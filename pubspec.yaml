name: tech_swap
description: "A device swap marketplace"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  image_picker: ^1.1.2
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icon/

# FIXED: Native Splash Screen
flutter_native_splash:
  color: "#0C1923"
  image: assets/images/splash_logo_native.png
  android: true
  ios: true
  android_12:
    color: "#0C1923"
    image: assets/images/splash_logo_native.png
  android_gravity: center
  ios_content_mode: center

